[package]
name = "ouro_language_server"
version = "0.0.0"
edition = "2024"

[dependencies]
ouro_index_vec = { path = "../ouro_index_vec" }
ouro_span = { path = "../ouro_span" }
ouro_tokenize = { path = "../ouro_tokenize" }
ouro_parse_node = { path = "../ouro_parse_node" }
ouro_parse = { path = "../ouro_parse" }
ouro_resolve = { path = "../ouro_resolve" }
ouro_token_sum_tree = { path = "../ouro_token_sum_tree" }

async-lsp = { version = "0.2.4", features = ["tokio"] }
lsp-types = "0.95.0"
tracing = "0.1.37"
tokio = { version = "1.27.0", features = ["io-std", "io-util", "macros", "process", "rt", "time"] }
tower = "0.5"
tracing-subscriber = "0.3.16"

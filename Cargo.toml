[workspace]
# Every folder in toolchain/ is a crate.
members = ["toolchain/*"]
resolver = "3"

# Shared by every crate: `version.workspace = true`, `edition.workspace = true`.
[workspace.package]
version = "0.0.0"
edition = "2024"

[workspace.dependencies]
insta = "1.46.1"

# Internal crates. Depend on one with `ouro_foo.workspace = true`.
ouro_index_vec = { path = "toolchain/ouro_index_vec" }
ouro_parse = { path = "toolchain/ouro_parse" }
ouro_parse_types = { path = "toolchain/ouro_parse_types" }
ouro_resolve = { path = "toolchain/ouro_resolve" }
ouro_span = { path = "toolchain/ouro_span" }
ouro_token_sum_tree = { path = "toolchain/ouro_token_sum_tree" }
ouro_tokenize = { path = "toolchain/ouro_tokenize" }
ouro_tokenize_types = { path = "toolchain/ouro_tokenize_types" }

[profile.dev.package.insta]
opt-level = 3

[profile.dev.package.similar]
opt-level = 3
